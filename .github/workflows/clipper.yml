# Tourne tout seul sur les serveurs de GitHub (gratuit et illimité : repo public).
# Clés à mettre dans Settings > Secrets and variables > Actions :
#   TWITCH_CLIENT_ID, TWITCH_CLIENT_SECRET, TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID
name: Clipper auto

on:
  schedule:
    - cron: "17 */2 * * *"   # toutes les 2 h (heure UTC). Plus souvent = plus de minutes consommées.
  workflow_dispatch: {}       # bouton « Run workflow » pour lancer à la main

concurrency:
  group: clipper
  cancel-in-progress: false

jobs:
  clips:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer ffmpeg + polices
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-liberation > /dev/null

      - name: Installer les dépendances
        run: pip install -q -r requirements.txt

      # Mémoire des clips déjà envoyés (pour ne jamais renvoyer le même)
      - name: Récupérer la mémoire
        uses: actions/cache/restore@v4
        with:
          path: deja_faits.json
          key: deja-faits-${{ github.run_id }}
          restore-keys: deja-faits-

      # Modèle Whisper gardé entre deux lancements (évite de le retélécharger)
      - name: Cache du modèle Whisper
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-base-v1

      - name: Récupérer, monter, envoyer
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WHISPER_MODELE: base
        run: |
          if [ -z "$TWITCH_CLIENT_ID" ]; then
            echo "::warning::Clés Twitch pas encore ajoutées dans les Secrets du repo : rien à faire."
            exit 0
          fi
          python main.py --heures 3

      - name: Sauver la mémoire
        if: always()
        uses: actions/cache/save@v4
        with:
          path: deja_faits.json
          key: deja-faits-${{ github.run_id }}
