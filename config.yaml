# Streamers à surveiller (login Twitch, celui dans l'URL twitch.tv/xxx)
streamers:
  - squeezie
  # La facecam est détectée automatiquement sur chaque clip (aperçu dans bruts/*_facecam.jpg).
  # Si la détection se trompe pour un streamer, force la zone (fractions 0 à 1,
  # x,y = coin haut-gauche ; l,h = largeur, hauteur) ou désactive-la :
  # - nom: autre_streamer
  #   facecam: { x: 0.75, y: 0.0, l: 0.25, h: 0.28 }   # ou: facecam: aucune

recuperation:
  heures: 24             # clips créés ces X dernières heures
  max_par_streamer: 5    # nombre de clips récupérés à chaque passe
  tri: recents           # recents = les plus récents d'abord ; vues = les plus vus
  vues_min: 0            # ignore les clips sous ce nombre de vues

dossier_sortie: clips

# Bande violette avec le titre du clip (entre la cam et le jeu)
titre:
  actif: true
  hauteur: 170
  taille: 58
  couleur_fond: "#7B2FF7"

montage:
  duree_max: 60          # coupe au-delà (secondes)
  hauteur_facecam: 620   # hauteur de la facecam en haut (le jeu prend le reste)
  garder_ass: false      # garder le fichier de sous-titres .ass (pour le retoucher)

sous_titres:
  actif: true
  modele_whisper: small  # tiny / base / small / medium (plus gros = plus précis, plus lent)
  langue: fr
  mots_par_ligne: 3
  taille: 82
  police: Arial
  couleur_mot_actif: "#FFD400"
  marge_bas: 520         # distance au bas de l'écran (zone de sécurité TikTok)

# Texte affiché en haut de la vidéo (ex: "Partenariat rémunéré"). Vide = rien.
mention_pub: ""
